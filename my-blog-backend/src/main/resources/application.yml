server:
  port: 8080

spring:
  application:
    name: my-blog-backend
  mail:
    host: smtp.qq.com
  # 默认本地开发；生产用环境变量 SPRING_PROFILES_ACTIVE=prod 切换
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    datatype:
      datetime:
        write-dates-as-timestamps: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

jwt:
  expire: 604800000